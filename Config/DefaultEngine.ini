[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/GemRoller/Maps/Arena.Arena
EditorStartupMap=/Game/GemRoller/Maps/Arena.Arena
; The game mode builds the whole course at runtime, so it works on *any* level.
GlobalDefaultGameMode=/Script/GemRoller.GemRollerGameMode

[/Script/Engine.PhysicsSettings]
; Heavier than the default -980 so the marble feels snappy. GRLayout.h (kGravity) uses the same number.
DefaultGravityZ=-1500.000000

[/Script/Engine.RendererSettings]
; Lumen GI + reflections, virtual shadow maps, no baked lighting (every light is movable).
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.AllowStaticLighting=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
